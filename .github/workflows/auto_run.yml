name: Daily Review Auto Generator

on:
  schedule:
    # 毎日 午前9時(日本時間) に自動実行 (UTC 0:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 手動実行ボタンも有効化

jobs:
  run-script:
    runs-runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ライブラリのインストール
        run: pip install -r requirements.txt

      - name: スクリプトの実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # WordPress連携時のみ以下もSecretsに登録して有効化
          # WP_DOMAIN: ${{ secrets.WP_DOMAIN }}
          # WP_USER: ${{ secrets.WP_USER }}
          # WP_APP_PASS: ${{ secrets.WP_APP_PASS }}
        run: python main.py
